<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>माँ शेरावाली दिव्य नवरात्रि यात्रा</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">

  <style> 
    :root {
      --gold: #f7d070;
      --gold-bright: #ffe89e;
      --gold-dark: #b8860b;   
      --deep-red: #5e0209;
      --maroon: #3b0005;
      --saffron: #e65c00;
      --glow-gold: 0 0 25px rgba(255, 215, 0, 0.7), 0 0 50px rgba(255, 140, 0, 0.4);
      --font-display: 'Rozha One', 'Yatra One', serif;
      --font-body: 'Tiro Devanagari Hindi', 'Mukta', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #40030a 0%, #1a0104 60%, #080002 100%);
      color: #fff9e6;
      font-family: var(--font-body);
    }

    #bg-canvas, #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #bg-canvas { z-index: 1; }
    #fx-canvas { z-index: 20; }

    .divine-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 92vmin;
      height: 92vmin;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 190, 40, 0.3) 0%, rgba(220, 60, 10, 0.16) 45%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 2;
      animation: pulseAura 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseAura {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.95; }
    }

    .music-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      background: rgba(35, 2, 6, 0.88);
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 8px 18px;
      border-radius: 30px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6), var(--glow-gold);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    .music-btn:active { transform: scale(0.95); }

    #experience-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    .mata-darshan-frame {
      position: relative;
      width: min(84vmin, 440px);
      height: min(84vmin, 440px);
      max-height: 48vh;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.8s ease;
    }

    .mata-darshan-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(255, 200, 50, 0.75)) drop-shadow(0 0 50px rgba(230, 80, 0, 0.45));
      animation: divineHover 5s ease-in-out infinite alternate;
    }

    @keyframes divineHover {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.02); }
    }

    h1.devotional-title {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4.4vw, 2.7rem);
      color: var(--gold-bright);
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    p.instruction-text {
      font-size: clamp(1rem, 2.7vw, 1.35rem);
      color: #ffecc2;
      max-width: 650px;
      margin-bottom: 20px;
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .anuj-badge {
      display: inline-block;
      font-size: 0.95rem;
      color: #ffdda1;
      border: 1px solid rgba(247, 208, 112, 0.4);
      background: rgba(45, 4, 8, 0.65);
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .btn-divine {
      background: linear-gradient(135deg, #d4380d 0%, #b31d04 50%, #780206 100%);
      color: #fff6d9;
      border: 2px solid var(--gold);
      padding: 13px 34px;
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      font-family: var(--font-body);
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), var(--glow-gold);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-divine:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: #ffffff;
      box-shadow: 0 8px 30px rgba(255, 180, 0, 0.85);
    }
    .btn-divine:active { transform: scale(0.96); }

    .touch-target {
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
      touch-action: manipulation;
    }
    .touch-target:hover { transform: scale(1.1); filter: drop-shadow(0 0 15px gold); }
    .touch-target:active { transform: scale(0.95); }

    .door-wrapper {
      position: relative;
      width: 280px;
      height: 330px;
      perspective: 1000px;
      margin: 10px auto 20px;
      border-radius: 140px 140px 10px 10px;
      overflow: hidden;
      border: 3px solid var(--gold);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
    }
    .door-panel {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #7a2202, #380802);
      border: 2px solid var(--gold);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      transition: transform 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      z-index: 5;
    }
    .door-left { left: 0; transform-origin: left; border-radius: 140px 0 0 0; }
    .door-right { right: 0; transform-origin: right; border-radius: 0 140px 0 0; }
    .door-open .door-left { transform: rotateY(-115deg); }
    .door-open .door-right { transform: rotateY(115deg); }

    .aarti-stage-wrapper {
      position: relative;
      width: min(85vmin, 380px);
      height: min(85vmin, 380px);
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .aarti-orbit-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px dashed rgba(247, 208, 112, 0.35);
      pointer-events: none;
    }
    .revolving-diya {
      position: absolute;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      filter: drop-shadow(0 0 20px gold);
      pointer-events: none;
    }
    @keyframes circumambulate {
      0% { transform: rotate(0deg) translateX(min(38vmin, 160px)) rotate(0deg); }
      100% { transform: rotate(1080deg) translateX(min(38vmin, 160px)) rotate(-1080deg); }
    }
    .animate-aarti-revolution {
      animation: circumambulate 7.5s ease-in-out forwards;
    }

    .blessing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(20, 0, 4, 0.94) 0%, rgba(5, 0, 2, 0.98) 100%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .blessing-screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    .blessing-card {
      max-width: 680px;
      background: linear-gradient(135deg, rgba(60, 2, 8, 0.88), rgba(30, 0, 4, 0.96));
      border: 2px solid var(--gold);
      border-radius: 24px;
      padding: clamp(24px, 5vw, 42px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 50px rgba(255, 200, 40, 0.35);
      position: relative;
    }
    .blessing-text {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 3.2vw, 2rem);
      line-height: 1.6;
      color: #fff2b8;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 26px;
    }

    .final-tribute-banner {
      width: 100%;
      max-width: min(900px, 94vw);
      margin: 12px auto;
      padding: 14px 20px;
      background: linear-gradient(180deg, #4a0710 0%, #200207 100%);
      border: 3px solid #ffd700;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.25);
      position: relative;
      z-index: 25;
      text-align: center;
      animation: goldenGather 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      flex-shrink: 0;
    }

    .final-tribute-text {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 3.2vw, 2.1rem);
      font-weight: 800;
      color: #fff8dc;
      text-shadow: 
        0 2px 5px #000,
        0 0 12px rgba(255, 215, 0, 0.7);
      line-height: 1.4;
      letter-spacing: 0.5px;
      display: block;
    }

    @keyframes goldenGather {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .fade-in { animation: fadeIn 0.8s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- पृष्ठभूमि संगीत ऑडियो एलिमेंट्स (डायरेक्ट पाथ) -->
  <audio id="walkthrough-audio" loop preload="auto" src="O_Aaye_Tere_Bhawan_Music_by_Sonu_nigam_remix_by_Dj_Virat_Hajip.m4a"></audio>
  <audio id="aarti-audio" loop preload="auto" src="xyz.mp3"></audio>

  <!-- संगीत चालू/बंद बटन -->
  <button id="music-toggle" class="music-btn" aria-label="संगीत नियंत्रण">🎵 संगीत: चालू</button>

  <canvas id="bg-canvas"></canvas>
  <div class="divine-aura"></div>
  <canvas id="fx-canvas"></canvas>

  <main id="experience-container" role="main"></main>

  <aside id="blessing-modal" class="blessing-screen" aria-live="polite">
    <div class="blessing-card fade-in">
      <div style="font-size: 2.6rem; margin-bottom: 12px;">🙏</div>
      <p id="blessing-content" class="blessing-text"></p>
      <button id="blessing-next-btn" class="btn-divine">आगे बढ़ें ➔</button>
    </div>
  </aside>

  <script>
    /* =========================================================================
       1. सुरक्षित ऑडियो व साउंड सिस्टम (Autoplay-Safe Engine)
       ========================================================================= */
    class DevotionalSoundEngine {
      constructor() {
        this.ctx = null;
        this.musicMuted = false;
        this.currentMode = 'walkthrough';
        this.initialized = false;
      }

      init() {
        if (!this.initialized) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
          this.initialized = true;
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startWalkthroughTrack() {
        this.init();
        this.currentMode = 'walkthrough';
        const wtAudio = document.getElementById('walkthrough-audio');
        if (wtAudio && !this.musicMuted) {
          wtAudio.volume = 0.75;
          const promise = wtAudio.play();
          if (promise !== undefined) {
            promise.catch(e => console.log("यात्रा संगीत प्रतीक्षा में:", e));
          }
        }
      }

      switchToAartiTrack() {
        this.init();
        this.currentMode = 'aarti';
        const wtAudio = document.getElementById('walkthrough-audio');
        const aartiAudio = document.getElementById('aarti-audio');

        if (wtAudio) {
          wtAudio.pause();
          wtAudio.currentTime = 0;
        }

        if (aartiAudio && !this.musicMuted) {
          aartiAudio.volume = 0.85;
          const promise = aartiAudio.play();
          if (promise !== undefined) {
            promise.catch(e => console.log("आरती संगीत प्रतीक्षा में:", e));
          }
        }
      }

      toggleMusic() {
        this.init();
        this.musicMuted = !this.musicMuted;
        const wtAudio = document.getElementById('walkthrough-audio');
        const aartiAudio = document.getElementById('aarti-audio');

        if (this.musicMuted) {
          if (wtAudio) wtAudio.pause();
          if (aartiAudio) aartiAudio.pause();
        } else {
          if (this.currentMode === 'walkthrough') {
            this.startWalkthroughTrack();
          } else {
            this.switchToAartiTrack();
          }
        }
        return !this.musicMuted;
      }

      playTempleBell(freq = 880) {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 2.9);

          const overtone = this.ctx.createOscillator();
          const overGain = this.ctx.createGain();
          overtone.type = 'triangle';
          overtone.frequency.setValueAtTime(freq * 2.76, now);
          overGain.gain.setValueAtTime(0.18, now);
          overGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
          overtone.connect(overGain);
          overGain.connect(this.ctx.destination);
          overtone.start(now);
          overtone.stop(now + 1.7);
        } catch(e) {}
      }

      playShankh() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(260, now + 1.2);
          osc.frequency.exponentialRampToValueAtTime(210, now + 3.2);

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(450, now);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.45, now + 0.9);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 3.9);
        } catch(e) {}
      }

      playManjira() {
        this.playTempleBell(1760);
      }
    }

    const sound = new DevotionalSoundEngine();
    const musicBtn = document.getElementById('music-toggle');
    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isPlaying = sound.toggleMusic();
      musicBtn.textContent = isPlaying ? '🎵 संगीत: चालू' : '🔇 संगीत: बंद';
    });

    /* =========================================================================
       2. पुष्प वर्षा एवं स्वर्णिम प्रभाव (Canvas Engine)
       ========================================================================= */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    let w = bgCanvas.width = fxCanvas.width = window.innerWidth;
    let h = bgCanvas.height = fxCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      w = bgCanvas.width = fxCanvas.width = window.innerWidth;
      h = bgCanvas.height = fxCanvas.height = window.innerHeight;
    });

    const petals = [];
    const sparks = [];
    const fireworks = [];

    class SacredPetal {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = -20 - Math.random() * 50;
        this.size = 10 + Math.random() * 12;
        this.speedY = 1.2 + Math.random() * 2;
        this.speedX = Math.sin(Math.random() * Math.PI) * 1.5;
        this.rotation = Math.random() * 360;
        this.spin = (Math.random() - 0.5) * 2;
        this.color = ['#ff8800', '#ffaa00', '#d82200', '#f44336'][Math.floor(Math.random() * 4)];
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.015) + this.speedX * 0.4;
        this.rotation += this.spin;
        if (this.y > h + 20) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 0.5, this.size, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class GoldenSpark {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = -0.3;
        this.radius = 0.8 + Math.random() * 2.2;
        this.alpha = 0.2 + Math.random() * 0.8;
        this.speedY = -0.3 - Math.random() * 0.8;
      }
      update() {
        this.y += this.speedY;
        this.alpha += Math.sin(this.y * 0.05) * 0.02;
        if (this.y < -10) {
          this.x = Math.random() * w;
          this.y = h + 10;
        }
      }
      draw(ctx) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 215, 100, ${Math.max(0.1, Math.min(1, this.alpha))})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'gold';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 28; i++) petals.push(new SacredPetal());
    for (let i = 0; i < 65; i++) {
      const s = new GoldenSpark();
      s.y = Math.random() * h;
      sparks.push(s);
    }

    function triggerFlowerShower(multiplier = 35) {
      for (let i = 0; i < multiplier; i++) {
        const p = new SacredPetal();
        p.y = -10;
        petals.push(p);
      }
      if (petals.length > 90) petals.splice(0, petals.length - 90);
    }

    function createFirework(x, y) {
      const colors = ['#ffe066', '#ff4d4d', '#ff9900', '#ffd700'];
      for (let i = 0; i < 35; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = 2 + Math.random() * 4.5;
        fireworks.push({
          x, y,
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function renderParticles() {
      bgCtx.clearRect(0, 0, w, h);
      fxCtx.clearRect(0, 0, w, h);

      for (let s of sparks) {
        s.update();
        s.draw(bgCtx);
      }
      for (let p of petals) {
        p.update();
        p.draw(fxCtx);
      }

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.05;
        f.alpha -= 0.02;
        if (f.alpha <= 0) {
          fireworks.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.fillStyle = f.color;
        fxCtx.globalAlpha = f.alpha;
        fxCtx.shadowBlur = 12;
        fxCtx.shadowColor = 'gold';
        fxCtx.beginPath();
        fxCtx.arc(f.x, f.y, 2.5, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }

      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    /* =========================================================================
       3. आपकी मूल तस्वीरों के सटीक नाम
       ========================================================================= */
    const IMG_SANCTUM_NIGHT   = "Screenshot_20260929-212039.png";
    const IMG_TEMPLE_JEWELED  = "Screenshot_20260929-212048.png";
    const IMG_SHERAWALI_LION  = "Screenshot_20260929-212112.png";

    const container = document.getElementById('experience-container');
    const modal = document.getElementById('blessing-modal');
    const blessingText = document.getElementById('blessing-content');
    const nextBtn = document.getElementById('blessing-next-btn');

    let currentStage = 1;

    function showBlessing(blessingHindi, onNextCallback) {
      sound.playTempleBell(987);
      triggerFlowerShower(35);
      blessingText.textContent = blessingHindi;
      modal.classList.add('active');

      const clickHandler = () => {
        modal.classList.remove('active');
        nextBtn.removeEventListener('click', clickHandler);
        onNextCallback();
      };
      nextBtn.onclick = clickHandler;
    }

    /* =========================================================================
       4. व्यवस्थित निर्बाध चरण (प्रश्न व चयनित चरण हटाए गए)
       ========================================================================= */
    function renderStage(stage) {
      container.innerHTML = '';
      currentStage = stage;

      switch(stage) {
        /* ---------------- चरण 1: दिव्य प्रवेश ---------------- */
        case 1:
          container.innerHTML = `
            <div class="anuj-badge fade-in">॥ अनुज शर्मा द्वारा प्रस्तुत पावन नवरात्रि आराधना ॥</div>
            <div class="mata-darshan-frame fade-in">
              <img src="${IMG_SANCTUM_NIGHT}" alt="माँ शेरावाली पावन धाम" />
            </div>
            <h1 class="devotional-title fade-in">माता रानी के पावन धाम में आपका स्वागत है</h1>
            <p class="instruction-text fade-in">आइए, नवरात्रि की इस दिव्य यात्रा पर चलें।</p>
            <button id="btn-s1" class="btn-divine fade-in">दिव्य यात्रा प्रारंभ करें 🙏</button>
          `;
          document.getElementById('btn-s1').onclick = () => {
            sound.init();
            sound.playTempleBell(880);
            sound.startWalkthroughTrack();
            showBlessing("माता रानी आपके जीवन में सुख, शांति और समृद्धि का प्रकाश भर दें।", () => renderStage(2));
          };
          break;

        /* ---------------- चरण 2: ज्योति प्रज्वलन ---------------- */
        case 2:
          container.innerHTML = `
            <h1 class="devotional-title fade-in">पावन ज्योति</h1>
            <p class="instruction-text fade-in">माता रानी के चरणों में श्रद्धा की ज्योति प्रज्वलित करें।</p>
            <div id="diya-target" class="touch-target fade-in" style="font-size: 6rem; margin: 20px 0;">🪔</div>
            <p style="color: var(--gold); font-size: 1.1rem;">(दीपक को स्पर्श करें)</p>
          `;
          document.getElementById('diya-target').onclick = () => {
            sound.playTempleBell(1046);
            showBlessing("माता रानी आपके जीवन से हर अंधकार दूर कर ज्ञान और सुख की ज्योति जलाए रखें।", () => renderStage(3));
          };
          break;
/* ---------------- चरण 3: पुष्प अर्पण ---------------- */
        case 3:
          container.innerHTML = `
            <h1 class="devotional-title fade-in">पुष्प अर्पण</h1>
            <p class="instruction-text fade-in">माता रानी के चरणों में पुष्प अर्पित करें।</p>
            <div style="display: flex; gap: 20px; justify-content: center; margin: 25px 0;">
              <span class="touch-target flower-item" style="font-size: 3.5rem;">🌹</span>
              <span class="touch-target flower-item" style="font-size: 3.5rem;">🪷</span>
              <span class="touch-target flower-item" style="font-size: 3.5rem;">🌼</span>
              <span class="touch-target flower-item" style="font-size: 3.5rem;">🌺</span>
            </div>
            <p id="flower-status" style="color: var(--gold);">सभी पुष्पों को स्पर्श कर माता रानी को अर्पित करें</p>
          `;
          let offered = 0;
          document.querySelectorAll('.flower-item').forEach(el => {
            el.addEventListener('click', () => {
              if (el.style.visibility === 'hidden') return;
              el.style.visibility = 'hidden';
              sound.playManjira();
              triggerFlowerShower(12);
              offered++;
              if (offered === 4) {
                setTimeout(() => {
                  showBlessing("माता रानी आपके जीवन को इन पुष्पों की तरह सुंदर, पवित्र और मंगलमय बनाए रखें।", () => renderStage(4));
                }, 400);
              }
            });
          });
          break;
      
        

        /* ---------------- चरण 4: मंदिर की घंटियाँ ---------------- */
        case 4:
          container.innerHTML = `
            <h1 class="devotional-title fade-in">मंगल ध्वनि</h1>
            <p class="instruction-text fade-in">मंदिर की घंटियों के साथ इस पावन वातावरण को मंगलमय करें।</p>
            <div style="display: flex; gap: 26px; justify-content: center; margin: 30px 0;">
              <span class="touch-target bell-el" data-f="659" style="font-size: 4rem;">🔔</span>
              <span class="touch-target bell-el" data-f="880" style="font-size: 4.8rem;">🔔</span>
              <span class="touch-target bell-el" data-f="1174" style="font-size: 4rem;">🔔</span>
            </div>
            <p style="color: var(--gold);">प्रत्येक घंटी को बजाकर मंदिर को गुंजायमान करें</p>
          `;
          let bellsRung = 0;
          document.querySelectorAll('.bell-el').forEach(bell => {
            bell.onclick = () => {
              sound.playTempleBell(parseFloat(bell.dataset.f));
              triggerFlowerShower(8);
              bell.style.transform = "rotate(15deg) scale(1.15)";
              setTimeout(() => bell.style.transform = "none", 250);
              bellsRung++;
              if (bellsRung >= 3) {
                setTimeout(() => {
                  showBlessing("माता रानी की कृपा से आपके घर-आंगन में सुख, शांति और मंगल की ध्वनि सदा गूँजती रहे।", () => renderStage(5));
                }, 600);
              }
            };
          });
          break;

        /* ---------------- चरण 5: मंदिर का कपाट खुलना और चित्र प्रकटीकरण ---------------- */
        case 5:
          container.innerHTML = `
            <h1 class="devotional-title fade-in">पावन कपाट</h1>
            <p class="instruction-text fade-in">दिव्य मंदिर का द्वार आपके स्वागत के लिए प्रतीक्षारत है।</p>
            <div id="temple-doors" class="door-wrapper fade-in">
              <div id="sanctum-deity" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #631201 0%, #1a0003 100%); z-index: 1;">
                <img src="${IMG_TEMPLE_JEWELED}" alt="गर्भगृह दर्शन" id="revealed-mata-img" style="width: 100%; height: 100%; object-fit: cover; filter: drop-shadow(0 0 25px gold); opacity: 0; transform: scale(0.9); transition: all 1.4s ease 0.3s;" />
              </div>
              <div class="door-panel door-left"><span style="font-size: 2.2rem;">🪷</span><span style="font-size: 2.2rem;">🔔</span></div>
              <div class="door-panel door-right"><span style="font-size: 2.2rem;">🪷</span><span style="font-size: 2.2rem;">🔔</span></div>
            </div>
            <button id="open-door-btn" class="btn-divine">द्वार खोलें 🚪</button>
          `;

          document.getElementById('open-door-btn').onclick = () => {
            sound.playTempleBell(587);
            sound.playShankh();
            triggerFlowerShower(35);

            document.getElementById('temple-doors').classList.add('door-open');

            const mataImg = document.getElementById('revealed-mata-img');
            if (mataImg) {
              mataImg.style.opacity = "1";
              mataImg.style.transform = "scale(1.05)";
            }

            setTimeout(() => {
              showBlessing("माता रानी आपके जीवन के हर बंद द्वार को सफलता और सौभाग्य के लिए खोल दें।", () => renderStage(6));
            }, 2000);
          };
          break;

        /* ---------------- चरण 6: मंगलमय शंखनाद ---------------- */
        case 6:
          container.innerHTML = `
            <h1 class="devotional-title fade-in">मंगलमय शंखनाद</h1>
            <p class="instruction-text fade-in">मंगलमय शंख ध्वनि के साथ दिव्य वातावरण का स्वागत करें।</p>
            <div id="shankh-el" class="touch-target fade-in" style="font-size: 6.5rem; margin: 25px 0;">🐚</div>
            <p style="color: var(--gold);">(शंख को स्पर्श करें)</p>
          `;
          document.getElementById('shankh-el').onclick = () => {
            sound.playShankh();
            triggerFlowerShower(40);
            setTimeout(() => {
              showBlessing("माता रानी के आशीर्वाद से आपके जीवन में हर दिन मंगल, शांति और सकारात्मकता बनी रहे।", () => renderStage(7));
            }, 1200);
          };
          break;

        /* ---------------- चरण 7: दिव्य दर्शन और आरती ---------------- */
        case 7:
          sound.switchToAartiTrack();
          container.innerHTML = `
            <h1 class="devotional-title fade-in">महा आरती</h1>
            <p class="instruction-text fade-in">आरती प्रारंभ करें, श्रद्धा का पावन दीपक माता रानी के चारों ओर परिक्रमा करेगा।</p>
            
            <div class="aarti-stage-wrapper fade-in">
              <div class="aarti-orbit-ring"></div>
              <div class="mata-darshan-frame" style="width: 240px; height: 240px; margin: 0; z-index: 2;">
                <img src="${IMG_SHERAWALI_LION}" alt="माँ शेरावाली आरती" style="max-height: 100%;" />
              </div>
              <div id="moving-diya" class="revolving-diya">🪔</div>
            </div>
            <div style="margin-top: 15px;">
              <button id="start-aarti-btn" class="btn-divine">आरती प्रारंभ करें 🔔</button>
            </div>
          `;

          const aartiStartBtn = document.getElementById('start-aarti-btn');
          aartiStartBtn.onclick = () => {
            aartiStartBtn.disabled = true;
            aartiStartBtn.textContent = "आरती हो रही है... 🙏";
            
            sound.playTempleBell(1046);
            sound.playShankh();
            triggerFlowerShower(50);

            const diya = document.getElementById('moving-diya');
            diya.classList.add('animate-aarti-revolution');

            const bellInterval = setInterval(() => {
              sound.playTempleBell(880 + Math.random() * 200);
              triggerFlowerShower(12);
            }, 1800);

            setTimeout(() => {
              clearInterval(bellInterval);
              showBlessing("माता रानी आपके और आपके परिवार पर अपनी कृपा और आशीर्वाद सदैव बनाए रखें।", () => renderStage(8));
            }, 7600);
          };
          break;

        /* ---------------- चरण 8: अंतिम दिव्य आशीर्वाद ---------------- */
        case 8:
          container.innerHTML = `
            <div class="mata-darshan-frame fade-in" style="width: min(88vmin, 460px); max-height: 38vh;">
              <img src="${IMG_SHERAWALI_LION}" alt="शेरावाली माता अंतिम दर्शन" />
            </div>
            
            <h1 class="devotional-title fade-in" style="font-size: clamp(2rem, 5.2vw, 3.2rem); margin-bottom: 2px;">🌺 जय माता दी 🌺</h1>
            
            <div class="final-tribute-banner fade-in">
              <span class="final-tribute-text"> गोविन्द शर्मा की ओर से हार्दिक शुभकामनाएँ 🌺</span>
            </div>

            <p class="instruction-text fade-in" style="margin-bottom: 8px; font-weight: 600; color: #ffecc2;">
              माता रानी की कृपा आप और आपके परिवार पर सदैव बनी रहे। जीवन में सुख, शांति, समृद्धि और खुशियों का वास हो।
            </p>
            <h2 class="fade-in" style="font-family: var(--font-display); color: #ffd700; margin-bottom: 18px; font-size: 1.8rem; text-shadow: 0 0 15px gold;">🙏 शुभ नवरात्रि 🙏</h2>
            
            <button id="restart-btn" class="btn-divine fade-in">दिव्य यात्रा पुनः प्रारंभ करें 🔄</button>
          `;
          sound.playTempleBell(1046);
          triggerFlowerShower(65);
          createFirework(w * 0.5, h * 0.35);

          document.getElementById('restart-btn').onclick = () => {
            sound.currentMode = 'walkthrough';
            const aartiAudio = document.getElementById('aarti-audio');
            if (aartiAudio) {
              aartiAudio.pause();
              aartiAudio.currentTime = 0;
            }
            renderStage(1);
          };
          break;
      }
    }

    renderStage(1);
  </script>
</body>
</html>
